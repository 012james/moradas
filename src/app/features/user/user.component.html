<div class="perfil-root">
    <app-nav></app-nav>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <img 
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEWfc7TMmvKSbgVGH05m9MJ97rUGb8K33FsgG8m0ZIicdRQ7DXqnjMdW-fk5xMaOY-Z7GuGTSHshmiU2Y91x5pzK_7_rltfbbBDEf2zWILplkyWM5ehs5jS0dCT4eILNOjQMMmjiw5BI4hbHZe0p6Ot0U56EFpnq_fiuqdbFf7UCUSiIEo5reyivScXfElct_htUi6pusv4Q8n2MI5u0pwcFl96_pg0zB2RfwQifisvjiyp_hc2WOc5ChtV93CPFX1vEw-LZ-DaSGEeg" 
          alt="Condomínio Moradas Logo" 
          class="brand-logo"
        />
        <span class="brand-title">Perfil</span>
      </div>
    </div>
  </header>

    <main class="main-content">
        <div class="card">
            <div class="avatar-box">
                <div class="avatar-circle">
                <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" alt="Avatar" class="avatar-photo" />
                </div>
            </div>

            <h2 class="name">{{ user.name }}</h2>
            <p class="unit">{{ user.unit }}</p>
            <p class="email">{{ user.email }}</p>

            <div class="badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="badge-icon">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                </svg>
                <span>{{ user.status || 'CADASTRO APROVADO' }}</span>
            </div>

            <div class="divider"></div>

            <button type="button" class="logout-btn" (click)="logoutUser()">
                <div class="logout-icon-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ba1a1a" stroke-width="2" class="logout-icon">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </div>
                <div class="logout-info">
                    <span class="logout-title">Sair da conta</span>
                    <span class="logout-sub">Encerrar sessão com segurança</span>
                </div>
            </button>
        </div>
    </main>
