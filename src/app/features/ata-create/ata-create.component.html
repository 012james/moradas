<div class="app-page">
  <header class="page-topbar">
    <div>
      <a routerLink="/admin" class="back-link">
        <span translate="no" class="material-symbols-outlined notranslate">arrow_back_ios_new</span>
        Painel de Gestão
      </a>
      <h1>Nova Assembleia</h1>
    </div>
  </header>

  <label class="checkbox-row">
    <input type="checkbox" name="sendEmailOnPublish" [(ngModel)]="sendEmailOnPublish" />
    <span>Notificar todos os moradores aprovados por e-mail ao publicar</span>
  </label>

  <form class="form-card" (ngSubmit)="onCreateAssembly()">
    <!-- Tipo de Assembleia -->
    <div class="field-group">
      <label>Tipo de Convocação</label>
      <div class="type-selector">
        <button
          type="button"
          [class.active]="title === 'Assembleia Geral Extraordinária'"
          (click)="title = 'Assembleia Geral Extraordinária'"
        >
          Extraordinária (AGE)
        </button>
        <button
          type="button"
          [class.active]="title === 'Assembleia Geral Ordinária'"
          (click)="title = 'Assembleia Geral Ordinária'"
        >
          Ordinária (AGO)
        </button>
      </div>
    </div>

    <!-- Tema Principal -->
    <div class="field-group">
      <label>Título / Tema da Pauta</label>
      <input
        type="text"
        name="subtitle"
        [(ngModel)]="subtitle"
        placeholder="Ex: Pintura da Fachada e Reformas Estruturais"
        required
      />
    </div>

    <!-- Descrição Detalhada -->
    <div class="field-group">
      <label>Descrição e Deliberações</label>
      <textarea
        rows="4"
        name="description"
        [(ngModel)]="description"
        placeholder="Descreva os orçamentos, empresas concorrentes e regras de aplicação..."
        required
      ></textarea>
    </div>

    <!-- Prazo de Encerramento e Quórum Lado a Lado -->
    <div class="grid-2-cols">
      <div class="field-group">
        <label>Data de Encerramento</label>
        <input
          type="date"
          name="closingDate"
          [(ngModel)]="closingDate"
          required
        />
      </div>

      <div class="field-group">
        <label>Horário Limite</label>
        <input
          type="time"
          name="closingTime"
          [(ngModel)]="closingTime"
          required
        />
      </div>
    </div>

    <!-- Quórum Mínimo -->
    <div class="field-group">
      <div class="label-row">
        <label>Quórum Mínimo para Validação</label>
        <span class="quorum-hint">{{ minimumQuorum }} de 606 casas</span>
      </div>
      <input
        type="number"
        min="1"
        max="606"
        name="minimumQuorum"
        [(ngModel)]="minimumQuorum"
      />
    </div>

    <!-- Formato / Local -->
    <div class="field-group">
      <label>Modalidade / Local</label>
      <div class="location-pills">
        <button
          type="button"
          [class.selected]="locationPreset === 'Virtual (App)'"
          (click)="selectLocationPreset('Virtual (App)')"
        >
          <span translate="no" class="material-symbols-outlined notranslate">smartphone</span>
          Virtual (App)
        </button>

        <button
          type="button"
          [class.selected]="locationPreset === 'Salão de Festas (Híbrida)'"
          (click)="selectLocationPreset('Salão de Festas (Híbrida)')"
        >
          <span translate="no" class="material-symbols-outlined notranslate">groups</span>
          Híbrida (Salão)
        </button>

        <button
          type="button"
          [class.selected]="locationPreset === 'Outro'"
          (click)="selectLocationPreset('Outro')"
        >
          Outro Local
        </button>
      </div>

      <input
        *ngIf="locationPreset === 'Outro'"
        type="text"
        class="mt-input"
        name="customLocation"
        [(ngModel)]="customLocation"
        placeholder="Informe o bloco ou espaço..."
      />
    </div>

    <!-- Anexo de Proposta Técnica (PDF) -->
    <div class="pdf-upload-box">
      <div class="pdf-box-head">
        <span translate="no" class="material-symbols-outlined notranslate">picture_as_pdf</span>
        <div>
          <strong>Proposta Técnica ou Orçamento (PDF)</strong>
          <span>Cole o link do Google Drive ou arquivo público para consulta</span>
        </div>
      </div>

      <input
        type="url"
        name="pdfUrl"
        [(ngModel)]="pdfUrl"
        placeholder="https://drive.google.com/..."
      />
    </div>

    <div class="error-banner" *ngIf="errorMessage">
      <span translate="no" class="material-symbols-outlined notranslate">error</span>
      {{ errorMessage }}
    </div>

    <button type="submit" class="btn-publish" [disabled]="isSubmitting">
      <span translate="no" class="material-symbols-outlined notranslate">rocket_launch</span>
      {{ isSubmitting ? 'Publicando Edital...' : 'Publicar Assembleia Agora' }}
    </button>
  </form>
</div>
