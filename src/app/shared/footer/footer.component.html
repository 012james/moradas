<nav class="floating-dock notranslate" translate="no">
  <a routerLink="/atas" routerLinkActive="active" class="dock-item">
    <span translate="no" class="material-symbols-outlined notranslate">home</span>
    <span class="label">Início</span>
  </a>

  <a routerLink="/encomendas" routerLinkActive="active" class="dock-item">
    <div class="icon-wrap">
      <span translate="no" class="material-symbols-outlined notranslate">package_2</span>
      <span class="badge" *ngIf="(pendingPackagesCount$ | async) as pkgCount">
        {{ pkgCount }}
      </span>
    </div>
    <span class="label">Encomendas</span>
  </a>

  <a routerLink="/visitantes" routerLinkActive="active" class="dock-item">
    <span translate="no" class="material-symbols-outlined notranslate">badge</span>
    <span class="label">Visitas</span>
  </a>

  <!-- <a routerLink="/boletos" routerLinkActive="active" class="dock-item">
    <div class="icon-wrap">
      <span translate="no" class="material-symbols-outlined notranslate">receipt_long</span>
      <span class="badge amber" *ngIf="(openInvoicesCount$ | async) as invCount">
        {{ invCount }}
      </span>
    </div>
    <span class="label">Boletos</span>
  </a> -->

  <!-- Para Moradores: exibe Perfil no 5º slot | Para Síndico/Porteiro: exibe Gestão -->
  <a
    *ngIf="(isStaff$ | async) === false"
    routerLink="/perfil"
    routerLinkActive="active"
    class="dock-item"
  >
    <span translate="no" class="material-symbols-outlined notranslate">person</span>
    <span class="label">Perfil</span>
  </a>

  <a
    *ngIf="isStaff$ | async"
    routerLink="/admin"
    routerLinkActive="active"
    class="dock-item staff-tab"
  >
    <span translate="no" class="material-symbols-outlined notranslate">admin_panel_settings</span>
    <span class="label">Gestão</span>
  </a>
</nav>
